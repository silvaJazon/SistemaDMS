<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SistemaDMS - Histórico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal-content { max-width: 90%; max-height: 80vh; }
        .close { position: absolute; top: 15px; right: 35px; color: white; font-size: 40px; cursor: pointer; }
        .btn { padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: bold; }
        .btn-red { background: #E53E3E; color: white; }
        .btn-blue { background: #3182CE; color: white; }
    </style>
</head>
<body class="bg-gray-800 text-gray-200 font-sans min-h-screen">

    <header class="py-6 px-4 bg-gray-900 shadow-lg border-b border-gray-700 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-white">SistemaDMS <span class="text-blue-500">Histórico</span></h1>
            <nav class="flex gap-4 mt-2">
                <a href="/" class="text-gray-400 hover:text-blue-300">Monitoramento</a>
                <a href="/alerts" class="text-blue-400 border-b-2 border-blue-400">Histórico</a>
            </nav>
        </div>
        <button onclick="deleteAllAlerts()" class="btn btn-red border border-red-400">🗑️ Apagar Tudo</button>
    </header>

    <main class="p-4 md:p-6">
        <div class="max-w-7xl mx-auto bg-gray-900 rounded-lg shadow-2xl overflow-hidden border border-gray-700">
            <table id="alerts-table" class="w-full text-left">
                <thead class="bg-gray-800 uppercase text-xs text-gray-400 border-b border-gray-700">
                    <tr>
                        <th class="p-4">Data</th>
                        <th class="p-4">Evento</th>
                        <th class="p-4 text-center">Sync</th>
                        <th class="p-4">Detalhes</th>
                        <th class="p-4 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700 text-sm"></tbody>
            </table>
            <div class="bg-gray-800 p-4 border-t border-gray-700 flex justify-between">
                <button id="prev-page" class="btn btn-blue" disabled>Anterior</button>
                <span id="page-info">...</span>
                <button id="next-page" class="btn btn-blue" disabled>Próxima</button>
            </div>
        </div>
    </main>

    <div id="mediaModal" class="modal"><span class="close" onclick="closeModal()">&times;</span><div id="modalContent"></div></div>

    <script>
        const tableBody = document.querySelector("#alerts-table tbody");
        let allAlerts = [], currentPage = 1, itemsPerPage = 10;

        async function fetchAlerts() {
            try {
                const res = await fetch('/api/alerts');
                allAlerts = await res.json();
                renderPage();
            } catch (e) { console.error(e); }
        }

        function renderPage() {
            tableBody.innerHTML = '';
            const start = (currentPage-1)*itemsPerPage;
            const pageAlerts = allAlerts.slice(start, start+itemsPerPage);

            pageAlerts.forEach(a => {
                const row = tableBody.insertRow();
                const date = new Date(a.timestamp.replace('Z','')).toLocaleString('pt-PT');
                row.className = "hover:bg-gray-750";

                // Ícone de Sync
                const syncIcon = a.synced ? '<span class="text-green-400" title="Enviado">☁️✅</span>' : '<span class="text-yellow-500" title="Pendente">⏳</span>';

                row.innerHTML = `
                    <td class="p-4 text-gray-300">${date}</td>
                    <td class="p-4"><span class="px-2 py-1 rounded font-bold bg-gray-700 border border-gray-600">${a.type}</span></td>
                    <td class="p-4 text-center text-lg">${syncIcon}</td>
                    <td class="p-4 text-gray-400">${a.message}</td>
                    <td class="p-4 flex justify-center gap-2">
                        ${a.image_path ? `<button onclick="showMedia('img','${a.image_path}')" class="text-blue-400 hover:text-white">📷</button>`:''}
                        ${a.video_path ? `<button onclick="showMedia('vid','${a.video_path}')" class="text-red-400 hover:text-white">🎥</button>`:''}
                        <button onclick="deleteAlert(${a.id})" class="text-gray-500 hover:text-red-500 ml-2" title="Apagar">❌</button>
                    </td>`;
            });
            document.getElementById("page-info").textContent = `Pág ${currentPage} de ${Math.ceil(allAlerts.length/itemsPerPage)}`;
            document.getElementById("prev-page").disabled = currentPage===1;
            document.getElementById("next-page").disabled = currentPage===Math.ceil(allAlerts.length/itemsPerPage);
        }

        function showMedia(type, path) {
            const m = document.getElementById("mediaModal"), c = document.getElementById("modalContent");
            c.innerHTML = type==='img' ? `<img src="/alerts/images/${path}" class="modal-content">` : `<video src="/alerts/videos/${path}" controls autoplay class="modal-content"></video>`;
            m.style.display = "flex";
        }
        function closeModal() { document.getElementById("mediaModal").style.display = "none"; document.getElementById("modalContent").innerHTML=''; }

        async function deleteAlert(id) {
            const pwd = prompt("Digite a senha de administrador:");
            if (!pwd) return;
            const res = await fetch(`/api/alerts/${id}`, { method: 'DELETE', headers: {'X-Admin-Password': pwd} });
            if ((await res.json()).success) { alert("Apagado!"); fetchAlerts(); } else alert("Senha incorreta");
        }

        async function deleteAllAlerts() {
            const pwd = prompt("PERIGO: APAGAR TUDO?\nDigite a senha:");
            if (!pwd) return;
            const res = await fetch(`/api/alerts/all`, { method: 'DELETE', headers: {'X-Admin-Password': pwd} });
            if ((await res.json()).success) { alert("Limpo!"); fetchAlerts(); } else alert("Senha incorreta");
        }

        document.getElementById("prev-page").onclick = ()=>{if(currentPage>1)currentPage--;renderPage()};
        document.getElementById("next-page").onclick = ()=>{if(currentPage<Math.ceil(allAlerts.length/itemsPerPage))currentPage++;renderPage()};

        fetchAlerts();
    </script>
</body>
</html>
