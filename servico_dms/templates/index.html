<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SistemaDMS - Monitoramento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="range"] { width: 100%; height: 8px; background: #4a5568; border-radius: 999px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; background: #4299e1; border-radius: 50%; cursor: pointer; }
        .btn { padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: bold; width: 100%; margin-top: 5px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-blue { background: #3182CE; color: white; }
        .btn-green { background: #38A169; color: white; }
        .btn-red { background: #E53E3E; color: white; }
        .btn-purple { background: #805AD5; color: white; } /* Cor nova para MQTT */
        .input-text, .input-select, .input-number { width: 100%; background: #2D3748; border: 1px solid #4A5568; color: #E2E8F0; padding: 0.5rem; border-radius: 4px; margin-top: 2px; }
        details > summary { cursor: pointer; padding: 0.5rem; background: #2D3748; border-radius: 4px; font-weight: 600; margin-bottom: 0.5rem; }
        .label-row { display: flex; justify-content: space-between; font-size: 0.9rem; color: #CBD5E0; margin-bottom: 2px; }
        .status-badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .status-ok { background-color: #38A169; color: white; }
        .status-err { background-color: #E53E3E; color: white; }
        .status-wait { background-color: #718096; color: white; }
    </style>
</head>
<body class="bg-gray-800 text-gray-200 font-sans min-h-screen flex flex-col">

    <header class="py-4 px-6 bg-gray-900 shadow-md border-b border-gray-700 flex flex-wrap justify-between items-center gap-4">
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
            SistemaDMS <span class="text-green-400 text-sm align-top">Ao Vivo</span>
            <span id="mqtt-badge" class="status-badge status-wait">MQTT: ...</span>
        </h1>
        <nav class="flex gap-4">
            <a href="/" class="text-blue-400 border-b-2 border-blue-400 pb-1 font-medium">Monitoramento</a>
            <a href="/alerts" class="text-gray-400 hover:text-blue-300 font-medium transition-colors">Histórico</a>
        </nav>
    </header>

    <main class="flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6 p-4 max-w-[1600px] mx-auto w-full">
        <section class="lg:col-span-2 flex flex-col gap-4">
            <div class="bg-gray-900 p-4 rounded-lg shadow-xl border border-gray-700 flex flex-col items-center">
                {% if video_stream_enabled %}
                    <img id="stream" src="{{ url_for('video_feed') }}" class="w-full h-auto max-h-[70vh] object-contain rounded-lg border border-gray-600 bg-black">
                {% else %}
                    <div class="w-full h-64 bg-gray-800 flex items-center justify-center text-gray-500 rounded-lg border border-gray-600">Stream Desativado</div>
                {% endif %}
                <div class="mt-4 grid grid-cols-3 gap-4 w-full max-w-md text-center">
                    <div class="bg-gray-800 p-2 rounded border border-gray-600"><div class="text-xs text-gray-400 uppercase">Olhos (EAR)</div><div id="val-ear" class="text-xl font-mono text-blue-300 font-bold">-</div></div>
                    <div class="bg-gray-800 p-2 rounded border border-gray-600"><div class="text-xs text-gray-400 uppercase">Boca (MAR)</div><div id="val-mar" class="text-xl font-mono text-green-300 font-bold">-</div></div>
                    <div class="bg-gray-800 p-2 rounded border border-gray-600"><div class="text-xs text-gray-400 uppercase">FPS</div><div id="val-fps" class="text-xl font-mono text-yellow-300 font-bold">-</div></div>
                </div>
            </div>
        </section>

        <aside id="controls" class="bg-gray-900 p-5 rounded-lg shadow-xl border border-gray-700 h-fit max-h-[calc(100vh-100px)] overflow-y-auto custom-scrollbar">
            <div class="space-y-6">
                <details open><summary>Parâmetros de Fadiga</summary>
                    <div class="space-y-4 p-2">
                        <div><div class="label-row"><label>Limite Olhos (EAR)</label><span id="lbl-ear" class="font-mono text-blue-300">0.25</span></div><input type="range" name="ear_threshold" min="0.1" max="0.4" step="0.01"></div>
                        <div><div class="label-row"><label>Frames Olhos</label><span id="lbl-earf" class="font-mono">2</span></div><input type="range" name="ear_frames" min="1" max="10" step="1"></div>
                        <div><div class="label-row"><label>Limite Boca (MAR)</label><span id="lbl-mar" class="font-mono text-green-300">0.50</span></div><input type="range" name="mar_threshold" min="0.3" max="1.0" step="0.01"></div>
                        <div><div class="label-row"><label>Frames Boca</label><span id="lbl-marf" class="font-mono">2</span></div><input type="range" name="mar_frames" min="1" max="10" step="1"></div>
                    </div>
                </details>

                <details><summary>Câmara & Imagem</summary>
                    <div class="space-y-4 p-2">
                        <div><label class="text-sm">Rotação</label>
                            <select name="rotation" class="input-select"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select>
                        </div>
                        <div class="pt-2 border-t border-gray-700">
                            <div class="flex items-center mb-2"><input type="checkbox" name="auto_brightness" id="auto_brightness" class="w-4 h-4 rounded bg-gray-700"><label for="auto_brightness" class="ml-2 text-sm">Brilho Automático</label></div>
                            <div id="manual-brightness-group"><div class="label-row"><label>Brilho Manual</label><span id="lbl-bri" class="font-mono">0</span></div><input type="range" name="brightness" min="-64" max="64" step="1"></div>
                        </div>
                    </div>
                </details>

                <details><summary>Conectividade (MQTT)</summary>
                    <div class="space-y-4 p-2">
                        <div class="flex items-center mb-2"><input type="checkbox" id="mqtt_enabled" class="w-4 h-4 rounded bg-gray-700"><label for="mqtt_enabled" class="ml-2 text-sm font-bold text-blue-300">Ativar MQTT</label></div>
                        <div id="mqtt-inputs" class="space-y-3 pl-2 border-l-2 border-gray-700">
                            <div><label class="text-xs text-gray-400">Broker</label><input type="text" id="mqtt_broker" class="input-text"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="text-xs text-gray-400">Porta</label><input type="number" id="mqtt_port" class="input-number"></div>
                                <div><label class="text-xs text-gray-400">Retenção</label><input type="number" id="mqtt_retention_days" class="input-number"></div>
                            </div>
                            <div><label class="text-xs text-gray-400">IDs</label><input type="text" id="mqtt_device_id" class="input-text mb-1" placeholder="Device"><input type="text" id="mqtt_fleet_id" class="input-text" placeholder="Fleet"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="text-xs text-gray-400">User</label><input type="text" id="mqtt_username" class="input-text"></div>
                                <div><label class="text-xs text-gray-400">Pass</label><input type="password" id="mqtt_password" class="input-text"></div>
                            </div>
                            <button onclick="saveMqttSettings()" class="btn btn-purple mt-2">📡 Confirmar e Conectar</button>
                        </div>
                    </div>
                </details>

                <div class="pt-4 border-t-2 border-gray-700">
                    <h3 class="font-bold text-lg mb-2 text-blue-300">Perfis</h3>
                    <div class="bg-gray-800 p-3 rounded">
                        <select id="profile-select" class="input-select mb-3"></select>
                        <div class="grid grid-cols-2 gap-2 mb-3"><button onclick="loadProfile()" class="btn btn-green text-sm">Carregar</button><button onclick="deleteProfile()" class="btn btn-red text-sm">Apagar</button></div>
                        <div class="flex gap-2"><input type="text" id="new-profile-name" placeholder="Nome" class="input-text text-sm flex-grow"><button onclick="saveProfile()" class="btn btn-blue w-auto text-sm px-4">💾</button></div>
                    </div>
                    <p id="status-msg" class="text-center text-xs mt-2 text-yellow-300 h-4"></p>
                </div>
            </div>
        </aside>
    </main>

    <script>
        const controls = document.getElementById("controls");
        const statusMsg = document.getElementById("status-msg");
        const mqttBadge = document.getElementById("mqtt-badge");
        let debounceTimer;

        // Auto Update
        async function updateStats() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                if(data.status) {
                    document.getElementById("val-ear").textContent = data.status.ear || '-';
                    document.getElementById("val-mar").textContent = data.status.mar || '-';
                    document.getElementById("val-fps").textContent = data.status.fps || '-';
                }
                if (data.mqtt_enabled) {
                    mqttBadge.textContent = data.mqtt_connected ? "MQTT: ONLINE" : "MQTT: OFFLINE";
                    mqttBadge.className = data.mqtt_connected ? "status-badge status-ok" : "status-badge status-err";
                } else {
                    mqttBadge.textContent = "MQTT: OFF";
                    mqttBadge.className = "status-badge status-wait";
                }
            } catch(e) {}
        }
        setInterval(updateStats, 500);

        async function initPage() {
            const res = await fetch('/api/config');
            applySettingsToInputs(await res.json());
            fetchProfiles();
        }

        function applySettingsToInputs(settings) {
            // Campos Normais
            for (const [key, value] of Object.entries(settings)) {
                const input = document.querySelector(`[name="${key}"]`);
                if (input) {
                    if (input.type === 'checkbox') { input.checked = !!value; toggleGroups(input); }
                    else {
                        input.value = value;
                        const lbl = document.getElementById("lbl-" + key.substring(0,3));
                        if(lbl) lbl.textContent = value;
                    }
                }
            }
            // Campos MQTT (Agora com IDs específicos)
            const mqttIds = ["mqtt_broker", "mqtt_port", "mqtt_retention_days", "mqtt_device_id", "mqtt_fleet_id", "mqtt_username", "mqtt_password"];
            mqttIds.forEach(id => {
                const el = document.getElementById(id);
                if (el && settings[id] !== undefined) el.value = settings[id];
            });
            const mqttEn = document.getElementById("mqtt_enabled");
            if(mqttEn && settings["mqtt_enabled"] !== undefined) {
                mqttEn.checked = settings["mqtt_enabled"];
                toggleGroups(mqttEn);
            }
        }

        function toggleGroups(input) {
            if (input.name === 'auto_brightness') {
                document.getElementById('manual-brightness-group').style.opacity = input.checked ? '0.5' : '1';
                document.querySelector('[name="brightness"]').disabled = input.checked;
            }
            if (input.id === 'mqtt_enabled') {
                const inputs = document.getElementById('mqtt-inputs').querySelectorAll('input');
                document.getElementById('mqtt-inputs').style.opacity = input.checked ? '1' : '0.5';
                inputs.forEach(i => i.disabled = !input.checked);
            }
        }

        // Listener Global (Ignora MQTT)
        controls.addEventListener('input', handleInput);
        controls.addEventListener('change', handleInput);

        function handleInput(e) {
            const t = e.target;
            // Ignora Perfis e MQTT
            if (t.id.includes('profile') || t.id.includes('mqtt_')) return;

            if (t.type === 'range') {
                const lbl = document.getElementById("lbl-" + t.name.substring(0,3));
                if(lbl) lbl.textContent = t.value;
            }
            if (t.type === 'checkbox') toggleGroups(t);

            const payload = {};
            payload[t.name] = t.type==='checkbox' ? t.checked : (t.type==='number'||t.type==='range' ? parseFloat(t.value) : t.value);

            clearTimeout(debounceTimer);
            const delay = t.type === 'range' ? 300 : 0;
            debounceTimer = setTimeout(() => {
                fetch('/api/config', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)})
                .then(r=>r.json()).then(d=>{ statusMsg.textContent="Guardado."; setTimeout(()=>statusMsg.textContent="",2000); });
            }, delay);
        }

        // --- Salvar MQTT Explicito ---
        async function saveMqttSettings() {
            const payload = {
                mqtt_enabled: document.getElementById("mqtt_enabled").checked,
                mqtt_broker: document.getElementById("mqtt_broker").value,
                mqtt_port: parseInt(document.getElementById("mqtt_port").value),
                mqtt_retention_days: parseInt(document.getElementById("mqtt_retention_days").value),
                mqtt_device_id: document.getElementById("mqtt_device_id").value,
                mqtt_fleet_id: document.getElementById("mqtt_fleet_id").value,
                mqtt_username: document.getElementById("mqtt_username").value,
                mqtt_password: document.getElementById("mqtt_password").value
            };

            statusMsg.textContent = "A conectar MQTT...";
            statusMsg.style.color = "yellow";

            const res = await fetch('/api/config', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
            if(res.ok) {
                statusMsg.textContent = "MQTT Atualizado!";
                statusMsg.style.color = "#38A169";
                setTimeout(()=>statusMsg.textContent="", 3000);
            } else {
                statusMsg.textContent = "Erro ao salvar.";
                statusMsg.style.color = "red";
            }
        }

        // Perfis
        const selProfile = document.getElementById("profile-select");
        async function fetchProfiles() {
            try {
                const p = await (await fetch('/api/profiles')).json();
                selProfile.innerHTML = '<option value="">Selecione...</option>';
                Object.keys(p).forEach(k => { const o=document.createElement("option"); o.value=k; o.textContent=k; selProfile.appendChild(o); });
            } catch(e){}
        }
        async function saveProfile() {
            const n = document.getElementById("new-profile-name").value.trim();
            if(!n) return;
            // Pega config atual (backend vai filtrar MQTT)
            await fetch(`/api/profiles/${n}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(await(await fetch('/api/config')).json())});
            statusMsg.textContent="Perfil salvo!"; fetchProfiles();
        }
        async function loadProfile() {
            const name = selProfile.value;
            if(!name) return;

            // 1. Pega dados do perfil
            const resProfs = await fetch('/api/profiles');
            const profiles = await resProfs.json();
            const settings = profiles[name];

            if(settings) {
                // --- CORREÇÃO DE SEGURANÇA ---
                // Remove configurações de MQTT caso existam no perfil (de versões antigas)
                // Isto impede que carregar um perfil desligue a conexão.
                const forbiddenKeys = [
                    "mqtt_enabled", "mqtt_broker", "mqtt_port",
                    "mqtt_device_id", "mqtt_fleet_id",
                    "mqtt_username", "mqtt_password", "mqtt_retention_days"
                ];
                forbiddenKeys.forEach(key => delete settings[key]);
                // -----------------------------

                // 2. Aplica na API
                await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(settings)
                });

                // 3. Atualiza Inputs visuais
                applySettingsToInputs(settings);
                statusMsg.textContent = "Perfil carregado!";
            }
        }
        async function deleteProfile() {
            if(!selProfile.value || !confirm("Apagar?")) return;
            await fetch(`/api/profiles/${selProfile.value}`, {method:'DELETE'});
            fetchProfiles();
        }

        initPage();
    </script>
</body>
</html>
