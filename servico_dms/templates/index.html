<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SistemaDMS - Monitoramento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="range"] { width: 100%; height: 8px; background: #4a5568; border-radius: 999px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; background: #4299e1; border-radius: 50%; cursor: pointer; }

        .btn { padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: bold; width: 100%; margin-top: 5px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-blue { background: #3182CE; color: white; }
        .btn-green { background: #38A169; color: white; }
        .btn-red { background: #E53E3E; color: white; }
        .btn-gray { background: #4A5568; color: white; }

        .input-text, .input-select, .input-number {
            width: 100%; background: #2D3748; border: 1px solid #4A5568; color: #E2E8F0; padding: 0.5rem; border-radius: 4px; margin-top: 2px;
        }
        .input-text:focus, .input-select:focus { border-color: #4299e1; outline: none; }

        details > summary { cursor: pointer; padding: 0.5rem; background: #2D3748; border-radius: 4px; font-weight: 600; margin-bottom: 0.5rem; }
        details > summary:hover { background: #4A5568; }

        .label-row { display: flex; justify-content: space-between; font-size: 0.9rem; color: #CBD5E0; margin-bottom: 2px; }
        .sub-group { padding-left: 0.5rem; border-left: 2px solid #4A5568; margin-left: 0.2rem; }
    </style>
</head>
<body class="bg-gray-800 text-gray-200 font-sans min-h-screen flex flex-col">

    <header class="py-4 px-6 bg-gray-900 shadow-md border-b border-gray-700 flex flex-wrap justify-between items-center gap-4">
        <h1 class="text-2xl font-bold text-white">SistemaDMS <span class="text-green-400 text-sm align-top">Ao Vivo</span></h1>
        <nav class="flex gap-4">
            <a href="/" class="text-blue-400 border-b-2 border-blue-400 pb-1 font-medium">Monitoramento</a>
            <a href="/alerts" class="text-gray-400 hover:text-blue-300 font-medium transition-colors">Histórico</a>
        </nav>
    </header>

    <main class="flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6 p-4 max-w-[1600px] mx-auto w-full">

        <section class="lg:col-span-2 flex flex-col gap-4">
            <div class="bg-gray-900 p-4 rounded-lg shadow-xl border border-gray-700 flex flex-col items-center">
                {% if video_stream_enabled %}
                    <img id="stream" src="{{ url_for('video_feed') }}" class="w-full h-auto max-h-[70vh] object-contain rounded-lg border border-gray-600 bg-black">
                {% else %}
                    <div class="w-full h-64 bg-gray-800 flex items-center justify-center text-gray-500 rounded-lg border border-gray-600">Stream Desativado</div>
                {% endif %}

                <div class="mt-4 grid grid-cols-3 gap-4 w-full max-w-md text-center">
                    <div class="bg-gray-800 p-2 rounded border border-gray-600">
                        <div class="text-xs text-gray-400 uppercase">Olhos (EAR)</div>
                        <div id="val-ear" class="text-xl font-mono text-blue-300 font-bold">-</div>
                    </div>
                    <div class="bg-gray-800 p-2 rounded border border-gray-600">
                        <div class="text-xs text-gray-400 uppercase">Boca (MAR)</div>
                        <div id="val-mar" class="text-xl font-mono text-green-300 font-bold">-</div>
                    </div>
                    <div class="bg-gray-800 p-2 rounded border border-gray-600">
                        <div class="text-xs text-gray-400 uppercase">Câmara (FPS)</div>
                        <div id="val-fps" class="text-xl font-mono text-yellow-300 font-bold">-</div>
                    </div>
                </div>
            </div>
        </section>

        <aside id="controls" class="bg-gray-900 p-5 rounded-lg shadow-xl border border-gray-700 h-fit max-h-[calc(100vh-100px)] overflow-y-auto custom-scrollbar">

            <div class="space-y-6">
                <details open>
                    <summary>Parâmetros de Fadiga</summary>
                    <div class="space-y-4 p-2">
                        <div>
                            <div class="label-row"><label>Limite Olhos (EAR)</label><span id="lbl-ear" class="font-mono text-blue-300">0.25</span></div>
                            <input type="range" name="ear_threshold" min="0.1" max="0.4" step="0.01">
                        </div>
                        <div>
                            <div class="label-row"><label>Frames Olhos</label><span id="lbl-earf" class="font-mono">2</span></div>
                            <input type="range" name="ear_frames" min="1" max="10" step="1">
                        </div>
                        <div>
                            <div class="label-row"><label>Limite Boca (MAR)</label><span id="lbl-mar" class="font-mono text-green-300">0.50</span></div>
                            <input type="range" name="mar_threshold" min="0.3" max="1.0" step="0.01">
                        </div>
                        <div>
                            <div class="label-row"><label>Frames Boca</label><span id="lbl-marf" class="font-mono">2</span></div>
                            <input type="range" name="mar_frames" min="1" max="10" step="1">
                        </div>
                    </div>
                </details>

                <details>
                    <summary>Câmara & Imagem</summary>
                    <div class="space-y-4 p-2">
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-sm">Rotação da Imagem</label>
                            </div>
                            <select name="rotation" class="input-select">
                                <option value="0">0° (Normal)</option>
                                <option value="90">90°</option>
                                <option value="180">180°</option>
                                <option value="270">270°</option>
                            </select>
                        </div>

                        <div class="pt-2 border-t border-gray-700">
                            <div class="flex items-center mb-2">
                                <input type="checkbox" name="auto_brightness" id="auto_brightness" class="w-4 h-4 rounded bg-gray-700 border-gray-500 text-blue-500 focus:ring-0">
                                <label for="auto_brightness" class="ml-2 text-sm select-none cursor-pointer">Brilho Automático</label>
                            </div>
                            <div id="manual-brightness-group">
                                <div class="label-row"><label>Brilho Manual</label><span id="lbl-bri" class="font-mono">0</span></div>
                                <input type="range" name="brightness" min="-64" max="64" step="1">
                            </div>
                        </div>
                    </div>
                </details>

                <details>
                    <summary>Conectividade (MQTT)</summary>
                    <div class="space-y-4 p-2">
                        <div class="flex items-center mb-2">
                            <input type="checkbox" name="mqtt_enabled" id="mqtt_enabled" class="w-4 h-4 rounded bg-gray-700 border-gray-500 text-blue-500 focus:ring-0">
                            <label for="mqtt_enabled" class="ml-2 text-sm select-none cursor-pointer font-bold text-blue-300">Ativar Envio MQTT</label>
                        </div>

                        <div id="mqtt-inputs" class="space-y-3 sub-group">
                            <div>
                                <label class="text-xs text-gray-400">Broker</label>
                                <input type="text" name="mqtt_broker" class="input-text" placeholder="ex: broker.hivemq.com">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-xs text-gray-400">Porta</label>
                                    <input type="number" name="mqtt_port" class="input-number" placeholder="1883">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-400">Retenção (Dias)</label>
                                    <input type="number" name="mqtt_retention_days" class="input-number" min="0" max="365">
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-gray-400">ID Dispositivo</label>
                                <input type="text" name="mqtt_device_id" class="input-text">
                            </div>
                            <div>
                                <label class="text-xs text-gray-400">ID Frota</label>
                                <input type="text" name="mqtt_fleet_id" class="input-text">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-xs text-gray-400">User (Opcional)</label>
                                    <input type="text" name="mqtt_username" class="input-text">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-400">Pass (Opcional)</label>
                                    <input type="password" name="mqtt_password" class="input-text">
                                </div>
                            </div>
                        </div>
                    </div>
                </details>

                <div class="pt-4 border-t-2 border-gray-700">
                    <h3 class="font-bold text-lg mb-2 text-blue-300">Gestão de Perfis</h3>
                    <div class="bg-gray-800 p-3 rounded">
                        <select id="profile-select" class="input-select mb-3"></select>

                        <div class="grid grid-cols-2 gap-2 mb-3">
                            <button onclick="loadProfile()" class="btn btn-green text-sm">📥 Carregar</button>
                            <button onclick="deleteProfile()" class="btn btn-red text-sm">🗑️ Apagar</button>
                        </div>

                        <div class="flex gap-2">
                            <input type="text" id="new-profile-name" placeholder="Nome Novo Perfil" class="input-text text-sm flex-grow">
                            <button onclick="saveProfile()" class="btn btn-blue w-auto text-sm px-4">💾</button>
                        </div>
                    </div>
                    <p id="status-msg" class="text-center text-xs mt-2 text-yellow-300 h-4"></p>
                </div>
            </div>
        </aside>
    </main>

    <script>
        const controls = document.getElementById("controls");
        const statusMsg = document.getElementById("status-msg");
        let debounceTimer;

        // --- 1. Atualização de Status em Tempo Real (500ms) ---
        async function updateStats() {
            try {
                // Usa apenas GET para ler status, sem enviar dados
                const res = await fetch('/api/config');
                const data = await res.json();

                if(data.status) {
                    document.getElementById("val-ear").textContent = data.status.ear || '-';
                    document.getElementById("val-mar").textContent = data.status.mar || '-';
                    // FPS: Se não vier do status, tenta calcular localmente ou placeholder
                    document.getElementById("val-fps").textContent = data.status.fps || '-';
                }
            } catch(e) { console.debug("Erro update stats", e); }
        }
        setInterval(updateStats, 500);

        // --- 2. Inicialização: Carregar valores do servidor ---
        async function initPage() {
            try {
                const res = await fetch('/api/config');
                const settings = await res.json();
                applySettingsToInputs(settings);
                fetchProfiles(); // Carrega lista de perfis
            } catch(e) { console.error("Erro init:", e); }
        }

        function applySettingsToInputs(settings) {
            // Percorre todas as configurações recebidas e preenche os inputs correspondentes
            for (const [key, value] of Object.entries(settings)) {
                const input = document.querySelector(`[name="${key}"]`);
                if (input) {
                    if (input.type === 'checkbox') {
                        input.checked = !!value;
                        toggleGroups(input); // Atualiza visibilidade (ex: brilho manual)
                    } else {
                        input.value = value;
                        // Atualiza labels de sliders
                        const lbl = document.getElementById("lbl-" + key.substring(0,3)); // ex: ear, mar
                        if(lbl) lbl.textContent = value;
                        const lbl2 = document.getElementById("lbl-" + key.substring(0,4)); // ex: earf
                        if(lbl2) lbl2.textContent = value;
                    }
                }
            }
        }

        function toggleGroups(input) {
            // Lógica visual para desativar inputs dependentes
            if (input.name === 'auto_brightness') {
                const manualGroup = document.getElementById('manual-brightness-group');
                const manualInput = document.querySelector('[name="brightness"]');
                if (manualGroup && manualInput) {
                    if (input.checked) {
                        manualGroup.style.opacity = '0.5';
                        manualInput.disabled = true;
                    } else {
                        manualGroup.style.opacity = '1';
                        manualInput.disabled = false;
                    }
                }
            }
            if (input.name === 'mqtt_enabled') {
                const group = document.getElementById('mqtt-inputs');
                if (group) group.style.opacity = input.checked ? '1' : '0.5';
                const inputs = group.querySelectorAll('input');
                inputs.forEach(i => i.disabled = !input.checked);
            }
        }

        // --- 3. Envio de Configurações (Genérico) ---
        // Escuta 'input' (sliders) e 'change' (selects, checkboxes, textos)
        controls.addEventListener('input', handleInput);
        controls.addEventListener('change', handleInput);

        function handleInput(e) {
            const target = e.target;
            // Ignora campos de perfil (são locais)
            if (target.id === 'new-profile-name' || target.id === 'profile-select') return;

            // Para inputs de texto, só envia no 'change' (quando perde foco ou Enter)
            if ((target.type === 'text' || target.type === 'number' || target.type === 'password') && e.type === 'input') return;

            // Atualiza UI imediata
            if (target.type === 'range') {
                const lbl = document.getElementById("lbl-" + target.name.substring(0,3));
                if(lbl) lbl.textContent = target.value;
                const lbl2 = document.getElementById("lbl-" + target.name.substring(0,4));
                if(lbl2) lbl2.textContent = target.value;
            }
            if (target.type === 'checkbox') toggleGroups(target);

            // Prepara Payload
            const payload = {};
            if (target.type === 'checkbox') payload[target.name] = target.checked;
            else if (target.type === 'number' || target.type === 'range') payload[target.name] = parseFloat(target.value);
            else payload[target.name] = target.value; // Text, Password, Select

            // Envia (com Debounce para sliders)
            clearTimeout(debounceTimer);
            const delay = target.type === 'range' ? 300 : 0; // Texto/Select envia logo

            debounceTimer = setTimeout(() => {
                fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                }).then(res => res.json())
                  .then(d => {
                      if(!d.success) console.error("Erro guardar:", d.error);
                      statusMsg.textContent = "Guardado.";
                      setTimeout(() => statusMsg.textContent = "", 2000);
                  });
            }, delay);
        }

        // --- 4. Perfis (Server-Side) ---
        const selProfile = document.getElementById("profile-select");

        async function fetchProfiles() {
            try {
                const res = await fetch('/api/profiles');
                const profiles = await res.json();
                selProfile.innerHTML = '<option value="">Selecione um perfil...</option>';
                Object.keys(profiles).forEach(name => {
                    const opt = document.createElement("option");
                    opt.value = name; opt.textContent = name;
                    selProfile.appendChild(opt);
                });
            } catch(e) { console.error("Erro perfis", e); }
        }

        async function saveProfile() {
            const name = document.getElementById("new-profile-name").value.trim();
            if(!name) { alert("Digite um nome!"); return; }

            // 1. Pega config atual completa
            const resConf = await fetch('/api/config');
            const currentConfig = await resConf.json();

            // 2. Salva como perfil
            const res = await fetch(`/api/profiles/${name}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(currentConfig)
            });
            if(res.ok) {
                statusMsg.textContent = `Perfil '${name}' salvo!`;
                document.getElementById("new-profile-name").value = "";
                fetchProfiles();
            }
        }

        async function loadProfile() {
            const name = selProfile.value;
            if(!name) return;

            // 1. Pega dados do perfil
            const resProfs = await fetch('/api/profiles');
            const profiles = await resProfs.json();
            const settings = profiles[name];

            if(settings) {
                // 2. Aplica na API
                await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(settings)
                });
                // 3. Atualiza Inputs visuais
                applySettingsToInputs(settings);
                statusMsg.textContent = "Perfil carregado!";
            }
        }

        async function deleteProfile() {
            const name = selProfile.value;
            if(!name) return;
            if(!confirm(`Apagar perfil '${name}'?`)) return;

            await fetch(`/api/profiles/${name}`, { method: 'DELETE' });
            fetchProfiles();
            statusMsg.textContent = "Perfil apagado.";
        }

        // Iniciar
        initPage();
    </script>
</body>
</html>
